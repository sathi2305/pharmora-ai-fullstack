
version: '3.8'
services:
  postgres:
    image: postgres:15
    environment: POSTGRES_USER=pharmora POSTGRES_PASSWORD=pharmora POSTGRES_DB=pharmora
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  neo4j:
    image: neo4j:5
    environment: NEO4J_AUTH=neo4j/pharmora123
    ports: ["7474:7474","7687:7687"]
  qdrant:
    image: qdrant/qdrant
    ports: ["6333:6333"]
  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes: ["./backend:/app"]
    ports: ["8000:8000"]
    depends_on: [postgres, redis, neo4j, qdrant]
  frontend:
    build: ./frontend
    ports: ["3000:3000"]
